<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Paper Deck</title>
  <meta name="description" content="A low-friction paper-reading library." />

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" href="./icons/icon-192.png" />

  <!-- iOS install support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Paper Deck" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="./styles.css" />

  <!-- PDF.js (UMD build; worker set in app.js) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div id="root">
    <div class="splash">
      <div class="splash-mark">📚</div>
      <div>Paper Deck</div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () =>
        navigator.serviceWorker.register('./sw.js').catch(() => {})
      );
    }
  </script>
</body>
</html>
